<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JoyInside 运营平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: #333; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .hidden-page { display: none !important; }
    /* 抽屉右滑动画 */
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .drawer-panel { animation: slideIn .22s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .mask-fade { animation: fadeIn .2s ease-out; }
    /* Toast */
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -8px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .toast-anim { animation: toastIn .2s ease-out; }
    .switch { width:44px; height:24px; border-radius:12px; background:#d9d9d9; position:relative; cursor:pointer; transition:background .2s; flex-shrink:0; }
    .switch.on { background:#1473e6; }
    .switch .knob { position:absolute; top:2px; left:2px; width:20px; height:20px; background:#fff; border-radius:50%; transition:transform .2s; }
    .switch.on .knob { transform:translateX(20px); }
  </style>
</head>
<body class="bg-[#f4f5f7]">
  <div id="app" class="w-full mx-auto h-screen overflow-hidden bg-[#f4f5f7]"></div>

  <!-- 弹窗/抽屉挂载点 -->
  <div id="overlay-root"></div>
  <!-- Toast 挂载点 -->
  <div id="toast-root"></div>

  <script>
  /* =========================================================
   * 全局状态与路由
   * ========================================================= */
  const State = {
    currentPage: 'index',
    currentAppData: null,   // 进入配置页携带的产品数据
    currentAppVersion: 'standard',
  };

  function setCurrentPage(key) {
    if (!key) return;
    State.currentPage = key;
    renderApp();
  }
  window.__setCurrentPage = setCurrentPage;

  /* ---------- Toast ---------- */
  function showToast(text, duration = 1800) {
    const root = document.getElementById('toast-root');
    const el = document.createElement('div');
    el.className = 'toast-anim fixed top-[80px] left-1/2 -translate-x-1/2 z-[200] bg-[#333] text-white text-[14px] px-[20px] py-[10px] rounded-[6px] shadow-lg';
    el.textContent = text;
    root.appendChild(el);
    setTimeout(() => el.remove(), duration);
  }

  /* ---------- Switch 组件 ---------- */
  function switchHtml(id, checked) {
    return `<div class="switch ${checked ? 'on' : ''}" data-switch="${id}"><div class="knob"></div></div>`;
  }
  // 事件委托：点击 switch 切换
  document.addEventListener('click', (e) => {
    const sw = e.target.closest('[data-switch]');
    if (sw && !sw.hasAttribute('data-controlled')) {
      const id = sw.getAttribute('data-switch') || '';
      // appConfig 的联动开关由其自身委托 renderApp 处理，此处不自动 toggle 以免冲突
      if (id.indexOf('ac-') === 0) return;
      sw.classList.toggle('on');
    }
  });

  /* ---------- 侧边栏 Layout ---------- */
  function layoutHtml(activeMenu, isResourceOpen, contentHtml) {
    var collapsed = sidebarCollapsed;
    const menuItem = (name, icon, label, page) => {
      const active = activeMenu === name;
      return `<div class="flex items-center ${collapsed ? 'justify-center' : ''} px-[12px] py-[10px] text-[14px] cursor-pointer rounded-[4px] ${active ? 'text-[#1473e6] bg-[#eef5fd] font-medium' : 'hover:bg-[#f5f5f5]'}" data-nav="${page || ''}" data-menu="${name}" title="${label}">
        <i class="fas ${icon} w-[20px] text-center ${collapsed ? '' : 'mr-[8px]'}"></i>${collapsed ? '' : ' ' + label}
      </div>`;
    };
    const subs = ['知识库','技能库','MCP服务','指令库','音色库','型号库'];
    const subPageMap = { 'MCP服务':'mcpService','指令库':'instructionLibrary','型号库':'modelLibrary' };
    const subHtml = subs.map(sub => {
      const active = activeMenu === `资源管理-${sub}`;
      return `<div class="text-[14px] cursor-pointer ${active ? 'text-[#1473e6] font-medium' : 'text-[#666] hover:text-[#1473e6]'}" data-nav="${subPageMap[sub]||''}" data-menu="资源管理-${sub}">${sub}</div>`;
    }).join('');
    const resourceActive = activeMenu.startsWith('资源管理');
    return `
    <div class="flex h-screen w-full bg-[#f4f5f7] font-sans text-[#333]">
      <aside class="${collapsed ? 'w-[64px]' : 'w-[240px]'} bg-white border-r border-[#e5e5e5] flex flex-col shrink-0 relative transition-all duration-200">
        <div class="h-[60px] flex items-center border-b border-[#e5e5e5] ${collapsed ? 'justify-center px-0' : 'px-[24px]'}">
          ${collapsed
            ? `<span class="text-[18px] font-bold text-[#1473e6]">J</span>`
            : `<span class="text-[20px] font-bold text-[#1473e6]">JoyInside</span>
               <span class="ml-[8px] bg-[#1473e6] text-white text-[12px] px-[6px] py-[2px] rounded-[4px]">内测版</span>`}
        </div>
        <div class="absolute top-[74px] -right-[10px] w-[20px] h-[20px] bg-white border border-[#e5e5e5] rounded-full flex items-center justify-center cursor-pointer text-[#999] hover:text-[#1473e6] hover:border-[#1473e6] shadow-sm z-30" data-toggle-sidebar="1" title="${collapsed ? '展开导航' : '收起导航'}">
          <i class="fas ${collapsed ? 'fa-angle-right' : 'fa-angle-left'} text-[12px]"></i>
        </div>
        <div class="${collapsed ? 'p-[8px]' : 'p-[16px]'}">
          ${collapsed ? '' : `<div class="flex items-center justify-between p-[8px] bg-[#f5f5f5] rounded-[4px] cursor-pointer mb-[16px]">
            <span class="text-[14px]">苏大强</span>
            <i class="fas fa-chevron-down text-[12px] text-[#666]"></i>
          </div>`}
          <nav class="space-y-[4px]">
            ${menuItem('首页','fa-home','首页','index')}
            ${menuItem('产品管理','fa-th-large','产品管理','index')}
            <div class="flex items-center ${collapsed ? 'justify-center' : 'justify-between'} px-[12px] py-[10px] text-[14px] cursor-pointer rounded-[4px] ${resourceActive ? 'text-[#1473e6] bg-[#eef5fd] font-medium' : 'hover:bg-[#f5f5f5]'}" data-toggle-resource="1" title="资源管理">
              <div class="flex items-center"><i class="fas fa-folder-open w-[20px] text-center ${collapsed ? '' : 'mr-[8px]'}"></i>${collapsed ? '' : ' 资源管理'}</div>
              ${collapsed ? '' : `<i class="fas fa-chevron-${isResourceOpen ? 'up':'down'} text-[12px] text-[#666]"></i>`}
            </div>
            ${(!collapsed && isResourceOpen) ? `<div class="pl-[40px] py-[4px] space-y-[8px]">${subHtml}</div>` : ''}
            ${menuItem('设备管理','fa-microchip','设备管理','deviceManage')}
            <div class="flex items-center ${collapsed ? 'justify-center' : 'justify-between'} px-[12px] py-[10px] text-[14px] cursor-pointer rounded-[4px] hover:bg-[#f5f5f5]" title="开发者中心">
              <div class="flex items-center"><i class="fas fa-code w-[20px] text-center ${collapsed ? '' : 'mr-[8px]'}"></i>${collapsed ? '' : ' 开发者中心'}</div>
              ${collapsed ? '' : `<i class="fas fa-chevron-down text-[12px] text-[#666]"></i>`}
            </div>
          </nav>
        </div>
        <div class="mt-auto ${collapsed ? 'p-[8px]' : 'p-[16px]'} border-t border-[#e5e5e5]">
          <div class="flex items-center ${collapsed ? 'justify-center' : ''} px-[12px] py-[10px] text-[14px] cursor-pointer hover:bg-[#f5f5f5] rounded-[4px]" title="个人信息">
            <i class="far fa-user w-[20px] text-center ${collapsed ? '' : 'mr-[8px]'}"></i>${collapsed ? '' : ' 个人信息'}
          </div>
        </div>
      </aside>
      <main class="flex-1 flex flex-col overflow-hidden">${contentHtml}</main>
    </div>`;
  }

  function activeMenuForPage(page) {
    if (page === 'mcpService') return '资源管理-MCP服务';
    if (page === 'instructionLibrary') return '资源管理-指令库';
    if (page === 'modelLibrary') return '资源管理-型号库';
    if (page === 'deviceManage') return '设备管理';
    if (page === 'appConfig') return '产品管理';
    return '产品管理';
  }
  function isResourcePage(page) {
    return ['mcpService','instructionLibrary','modelLibrary'].includes(page);
  }

  /* ---------- 页面渲染分发 ---------- */
  let resourceMenuOpen = false;
  let sidebarCollapsed = false;
  function renderApp() {
    const page = State.currentPage;
    if (isResourcePage(page)) resourceMenuOpen = true;
    const prevScroll = (function(){ const el=document.getElementById('ac-scroll'); return el?el.scrollTop:0; })();
    const contentHtml = renderPageContent(page);
    const html = layoutHtml(activeMenuForPage(page), resourceMenuOpen || isResourcePage(page), contentHtml);
    document.getElementById('app').innerHTML = html;
    bindPageEvents(page);
    const sc = document.getElementById('ac-scroll');
    if (sc && prevScroll) sc.scrollTop = prevScroll;
  }

  // 侧边栏导航事件委托
  document.addEventListener('click', (e) => {
    const nav = e.target.closest('[data-nav]');
    if (nav) {
      const page = nav.getAttribute('data-nav');
      if (page) { setCurrentPage(page); return; }
    }
    const toggle = e.target.closest('[data-toggle-resource]');
    if (toggle) { resourceMenuOpen = !resourceMenuOpen; renderApp(); }
    const sbToggle = e.target.closest('[data-toggle-sidebar]');
    if (sbToggle) { sidebarCollapsed = !sidebarCollapsed; renderApp(); return; }
  });

  // 占位：页面内容渲染（后续注入）
  function renderPageContent(page) {
    if (window.Pages && window.Pages[page]) return window.Pages[page]();
    return `<div class="p-[40px] text-[#999]">页面 ${page} 建设中…</div>`;
  }
  function bindPageEvents(page) {
    if (window.PageEvents && window.PageEvents[page]) window.PageEvents[page]();
  }

  window.Pages = {};
  window.PageEvents = {};
  window.App = { State, setCurrentPage, showToast, switchHtml, renderApp, renderPageContent };
  </script>

  <!-- ============ 通用抽屉 / 弹窗 辅助 ============ -->
  <script>
  const Overlay = document.getElementById('overlay-root');
  // 打开抽屉：右侧滑入。widthClass 控制宽度
  function openDrawer(innerHtml, opts = {}) {
    const width = opts.widthClass || 'w-[600px]';
    const wrap = document.createElement('div');
    wrap.className = 'fixed inset-0 z-50 flex justify-end';
    wrap.innerHTML = `
      <div class="absolute inset-0 mask-fade" style="background:rgba(0,0,0,0.25)" data-mask></div>
      <div class="drawer-panel relative ${width} h-full bg-white shadow-2xl">${innerHtml}</div>`;
    Overlay.appendChild(wrap);
    wrap.addEventListener('click', (e) => { if (!opts.noMaskClose && e.target && e.target.hasAttribute && e.target.hasAttribute('data-mask')) wrap.remove(); });
    if (opts.onMount) opts.onMount(wrap);
    return wrap;
  }
  // 打开居中弹窗
  function openModal(innerHtml, opts = {}) {
    const wrap = document.createElement('div');
    wrap.className = `fixed inset-0 z-[100] flex items-center justify-center ${opts.zClass||''}`;
    wrap.innerHTML = `
      <div class="absolute inset-0 mask-fade" style="background:rgba(0,0,0,0.45)" data-mask></div>
      <div class="relative">${innerHtml}</div>`;
    Overlay.appendChild(wrap);
    wrap.addEventListener('click', (e) => { if (!opts.noMaskClose && e.target && e.target.hasAttribute && e.target.hasAttribute('data-mask')) wrap.remove(); });
    if (opts.onMount) opts.onMount(wrap);
    return wrap;
  }
  function closeOverlay(el) { const w = el.closest('.fixed.inset-0'); if (w) w.remove(); }

  // 通用确认弹窗
  function confirmModal({ title, content, hint, onConfirm }) {
    const html = `
      <div class="w-[420px] bg-white rounded-[8px] shadow-xl overflow-hidden">
        <div class="px-[24px] pt-[24px] pb-[8px] flex items-start">
          <i class="fas fa-exclamation-circle text-[#faad14] text-[22px] mr-[12px] mt-[2px]"></i>
          <div>
            <h3 class="text-[16px] font-medium text-[#333]">${title||'提示'}</h3>
            <p class="text-[14px] text-[#666] mt-[8px]">${content||''}</p>
            ${hint ? `<p class="text-[13px] text-[#999] mt-[6px]">${hint}</p>` : ''}
          </div>
        </div>
        <div class="px-[24px] py-[16px] flex justify-end">
          <button data-cancel class="h-[34px] px-[18px] border border-[#d9d9d9] rounded-[4px] text-[14px] text-[#333] mr-[12px] hover:bg-[#f5f5f5]">取消</button>
          <button data-ok class="h-[34px] px-[18px] bg-[#1473e6] text-white rounded-[4px] text-[14px] hover:bg-[#1266d1]">确定</button>
        </div>
      </div>`;
    const wrap = openModal(html, { zClass: 'z-[110]' });
    wrap.querySelector('[data-cancel]').addEventListener('click', () => wrap.remove());
    wrap.querySelector('[data-ok]').addEventListener('click', () => { wrap.remove(); onConfirm && onConfirm(); });
  }

  window.App.openDrawer = openDrawer;
  window.App.openModal = openModal;
  window.App.closeOverlay = closeOverlay;
  window.App.confirmModal = confirmModal;
  </script>

  <!-- ============ 产品管理页 IndexPage ============ -->
  <script>
  const Products = {
    list: [
      { id:'11664', name:'测试1', voice:'美声-男声', date:'2026-06-24 14:48', author:'jd_cVqWlSefhCQV', productVersion:'standard', productType:'KJ-350', productCategory:'空气净化器', productPart:'后背', iotPlatform:'小家', typeDesc:'标准型空气净化设备', devBoardId:'-', devBoardType:'-', serialPrefix:'TCLS_KEVINBOX2__', desc:'12345' },
      { id:'11566', name:'609平台学习', voice:'秦彻 (测试)', date:'2026-06-09 14:56', author:'jd_cVqWlSefhCQV', productVersion:'lite', productType:'609-Lite', productCategory:'', productPart:'', iotPlatform:'', typeDesc:'', devBoardId:'kevin-box-lite', devBoardType:'-', serialPrefix:'TCLS_609LITE___', desc:'609平台学习设备' },
      { id:'11701', name:'端侧设备测试', voice:'美声-男声', date:'2026-08-03 10:00', author:'jd_cVqWlSefhCQV', productVersion:'standard', productType:'端侧-型号', productCategory:'', productPart:'', iotPlatform:'', typeDesc:'', devBoardId:'-', devBoardType:'-', serialPrefix:'-', desc:'端侧设备测试产品' },
      { id:'11702', name:'集贤产品测试', voice:'美声-男声', date:'2026-08-03 10:05', author:'jd_cVqWlSefhCQV', productVersion:'standard', productType:'集贤-型号', productCategory:'', productPart:'', iotPlatform:'集贤', typeDesc:'', devBoardId:'-', devBoardType:'-', serialPrefix:'-', desc:'集贤产品测试产品' }
    ]
  };

  function appCardHtml(data, idx) {
    const badge = data.productVersion === 'lite'
      ? '<span class="ml-[8px] text-[12px] px-[6px] py-[2px] rounded-[4px] bg-[#e6f7ff] text-[#1890ff] border border-[#91d5ff]">Lite版</span>'
      : (data.productVersion === 'standard' ? '<span class="ml-[8px] text-[12px] px-[6px] py-[2px] rounded-[4px] bg-[#f6ffed] text-[#52c41a] border border-[#b7eb8f]">标准版</span>' : '');
    const iotRow = data.productVersion === 'standard' ? `<span>IoT平台：${data.iotPlatform || '端侧设备'}</span>` : '<span></span>';
    return `
    <div class="bg-white rounded-[8px] p-[20px] shadow-sm border border-[#e5e5e5] relative hover:shadow-md transition-shadow cursor-pointer" data-card-config="${idx}">
      <div class="flex justify-between items-start mb-[40px]">
        <div class="flex items-center">
          <h3 class="text-[16px] font-medium text-[#333]">${data.name}</h3>${badge}
        </div>
        <button class="text-[#999] hover:text-[#333] px-[4px]" data-card-menu="${idx}"><i class="fas fa-ellipsis-h"></i></button>
        <div class="hidden absolute right-[20px] top-[40px] bg-white border border-[#e5e5e5] rounded-[4px] shadow-lg w-[120px] py-[8px] z-10" data-card-dropdown="${idx}">
          <div class="px-[16px] py-[8px] text-[14px] hover:bg-[#f5f5f5] cursor-pointer" data-card-edit="${idx}">编辑产品</div>
          <div class="px-[16px] py-[8px] text-[14px] hover:bg-[#f5f5f5] cursor-pointer" data-card-device="${idx}">设备管理</div>
          <div class="px-[16px] py-[8px] text-[14px] text-[#e1251b] hover:bg-[#f5f5f5] cursor-pointer" data-card-delete="${idx}">删除产品</div>
        </div>
      </div>
      <div class="flex justify-between items-center text-[12px] text-[#666] mb-[12px]"><span>APPID ${data.id}</span>${iotRow}</div>
      <div class="flex justify-between items-center text-[12px] text-[#999]">
        <span>${data.date}</span>
        <span class="flex items-center"><i class="far fa-user mr-[4px]"></i> ${data.author}</span>
      </div>
    </div>`;
  }

  window.Pages.index = function() {
    const cards = Products.list.map((d,i)=>appCardHtml(d,i)).join('');
    return `
    <div class="flex flex-col h-full bg-[#f4f5f7]">
      <div class="px-[24px] py-[16px] bg-white border-b border-[#e5e5e5] flex items-center justify-between" style="height:60px">
  <div>
          <h1 class="text-[20px] font-bold text-[#333] mb-[4px]">产品管理</h1>
          <p class="text-[14px] text-[#999]">产品能够决定设备拥有什么样的能力，一个产品可以绑定多个设备。</p>
        </div>
        <div class="flex items-center space-x-[16px]">
          <div class="relative w-[280px]">
            <input type="text" placeholder="输入产品名称" class="w-full h-[32px] pl-[12px] pr-[32px] border border-[#d9d9d9] rounded-[4px] text-[14px] focus:border-[#1473e6] focus:outline-none" />
            <i class="fas fa-search absolute right-[10px] top-[9px] text-[#999] cursor-pointer"></i>
          </div>
          <button data-create-product class="h-[32px] px-[16px] bg-[#1473e6] text-white rounded-[4px] text-[14px] hover:bg-[#115ebb] flex items-center"><i class="fas fa-plus mr-[4px]"></i> 新建</button>
        </div>
      </div>
      <div class="p-[24px] flex-1 overflow-y-auto">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-[20px] mb-[24px]">${cards}</div>
        <div class="flex justify-between items-center">
          <span class="text-[14px] text-[#666]">共${Products.list.length}条数据</span>
          <div class="flex space-x-[8px]">
            <button class="w-[32px] h-[32px] flex items-center justify-center border border-[#d9d9d9] rounded-[4px] text-[#ccc] cursor-not-allowed bg-white"><i class="fas fa-chevron-left text-[12px]"></i></button>
            <button class="w-[32px] h-[32px] flex items-center justify-center border border-[#1473e6] text-[#1473e6] rounded-[4px] bg-white">1</button>
            <button class="w-[32px] h-[32px] flex items-center justify-center border border-[#d9d9d9] rounded-[4px] text-[#ccc] cursor-not-allowed bg-white"><i class="fas fa-chevron-right text-[12px]"></i></button>
          </div>
        </div>
      </div>
    </div>`;
  };

  function productFormDrawer(mode, data) {
    const isEdit = mode === 'edit';
    const f = data || {};
    const disCls = isEdit ? 'bg-[#f5f5f5] text-[#999] cursor-not-allowed' : 'focus:border-[#1473e6] bg-white';
    const isStandard = (f.productVersion === 'standard');
    const standardBlock = `
      <div data-standard-block class="${isStandard ? '' : 'hidden'}">
        <div class="mb-[24px]">
          <label class="block text-[14px] text-[#333] mb-[8px]"><span class="text-[#e1251b] mr-[4px]">*</span>产品品类</label>
          <div class="relative"><select class="w-full h-[32px] px-[12px] border border-[#d9d9d9] rounded-[4px] text-[14px] appearance-none focus:border-[#1473e6] focus:outline-none bg-white">
            <option value="">请选择产品品类</option><option ${f.productCategory==='空气净化器'?'selected':''}>空气净化器</option><option>冰箱</option><option>洗衣机</option><option>空调</option><option>扫地机器人</option>
          </select><i class="fas fa-chevron-down absolute right-[12px] top-[10px] text-[12px] text-[#ccc] pointer-events-none"></i></div>
        </div>
        <div class="mb-[24px]"><label class="block text-[14px] text-[#333] mb-[8px]">产品部件</label>
          <input type="text" value="${f.productPart||''}" placeholder="请输入产品部件" class="w-full h-[32px] px-[12px] border border-[#d9d9d9] rounded-[4px] text-[14px] focus:border-[#1473e6] focus:outline-none" /></div>
        <div class="mb-[24px]"><label class="block text-[14px] text-[#333] mb-[8px]">IoT平台</label>
          <div class="relative"><select class="w-full h-[32px] px-[12px] border border-[#d9d9d9] rounded-[4px] text-[14px] appearance-none focus:border-[#1473e6] focus:outline-none bg-white">
            <option value="">请选择IoT平台</option><option ${f.iotPlatform==='小家'?'selected':''}>小家</option><option>京鱼座</option><option>美的美居</option><option ${f.iotPlatform==='集贤'?'selected':''}>集贤</option>
          </select><i class="fas fa-chevron-down absolute right-[12px] top-[10px] text-[12px] text-[#ccc] pointer-events-none"></i></div></div>
        <div><label class="block text-[14px] text-[#333] mb-[8px]"><span class="text-[#e1251b] mr-[4px]">*</span>型号描述</label>
          <textarea class="w-full h-[80px] p-[12px] border border-[#d9d9d9] rounded-[4px] text-[14px] resize-none focus:border-[#1473e6] focus:outline-none" placeholder="请输入型号描述">${f.typeDesc||''}</textarea></div>
      </div>`;
    const inner = `

        if (e.target.closest('[data-card-menu]')||e.target.closest('[data-card-dropdown]')) return;
        const idx = +card.getAttribute('data-card-config');
        const data = Products.list[idx];
        State.currentAppData = data; State.currentAppVersion = data.productVersion || 'lite';
        setCurrentPage('appConfig');
      });
    });
    root.querySelectorAll('[data-card-menu]').forEach(btn=>{
      btn.addEventListener('click',(e)=>{ e.stopPropagation();
        const idx = btn.getAttribute('data-card-menu');
        const dd = root.querySelector(`[data-card-dropdown="${idx}"]`);
        root.querySelectorAll('[data-card-dropdown]').forEach(x=>{ if(x!==dd) x.classList.add('hidden'); });
        dd.classList.toggle('hidden');
      });
    });

    root.querySelectorAll('[data-card-device]').forEach(b=>b.addEventListener('click',(e)=>{ e.stopPropagation(); setCurrentPage('deviceManage'); }));
    root.querySelectorAll('[data-card-delete]').forEach(b=>b.addEventListener('click',(e)=>{ e.stopPropagation();

  /* ---------- 添加指令：按钮下方下拉框 ---------- */
  function acAddCommandDropdown(){
    const esc = v => String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    if(!AC.cmdDropdownExpanded) AC.cmdDropdownExpanded = { sys:true, mine:true };
    const expanded = AC.cmdDropdownExpanded;
    // 指令分组：系统指令（内置）+ 我的指令（来自已配置指令集）
    const groups = [
      { id:'sys', name:'系统指令', items:[
        { name:'退出对话', type:'系统' },
        { name:'电量查询', type:'系统' },
    { name:'音量调节', type:'系统' }
      ]},
      { id:'mine', name:'我的指令', items:(AC.instructionSets||[]).map(s=>({ name:s.name, type:'自定义' })) }
    ];
    const chosen = new Set(AC.commands.map(c=>c.name));

    const tree = groups.map(g=>{
      const caret = expanded[g.id] ? 'fa-caret-down' : 'fa-caret-right';
      const children = expanded[g.id] ? g.items.map(it=>{
        const added = chosen.has(it.name);
        return `<div class="flex items-center pl-[28px] pr-[12px] h-[38px] rounded-[6px] ${added?'text-[#c9cdd4] cursor-not-allowed':'text-[#333] cursor-pointer hover:bg-[#f5f7fa]'}" ${added?'':`data-ac-cmd-pick="${esc(it.name)}" data-ac-cmd-type="${esc(it.type)}"`}>
            <span class="text-[14px]">${esc(it.name)}</span>
            ${added?'<span class="ml-auto text-[12px] text-[#86909c]">已添加</span>':''}
          </div>`;
      }).join('') : '';
      const emptyTip = (expanded[g.id] && g.items.length===0) ? `<div class="pl-[28px] py-[8px] text-[12px] text-[#c9cdd4]">暂无可选指令</div>` : '';
      return `<div class="mb-[4px]">
        <div class="flex items-center h-[38px] px-[8px] rounded-[6px] cursor-pointer hover:bg-[#f5f7fa]" data-ac-cmd-group="${g.id}">
          <i class="fas ${caret} w-[16px] text-[#4e5969]"></i>
          <span class="text-[14px] font-medium text-[#1d2129]">${g.name}</span>
        </div>${children}${emptyTip}
      </div>`;
    }).join('');

    return `<div class="absolute left-0 top-[calc(100%+6px)] z-[50] w-[260px] max-h-[360px] overflow-y-auto bg-white border border-[#e5e6eb] rounded-[8px] shadow-lg p-[8px]" data-ac-cmd-dropdown>${tree}</div>`;
  }

  /* ---------- AIoT指令控制区（standard版）---------- */
  function acAiotHtml(){
    if(State.currentAppVersion!=='standard') return '';
    const enabled = AC.aiotEnabled;
    // AIOT 能力（指令集/提示词/工具/状态翻译）为产品级共享配置，仅默认智能体可编辑；
    // 非默认智能体下：AIoT 开关与技能仍可用，其余编辑区置灰只读并引导跳转至默认智能体
    const _agent = acActiveAgent();
    const acReadonly = !!(_agent && !_agent.isDefault);
    const _defAgent = AC.agents.find(a=>a.isDefault);
    const promptRadio = (val,label)=>`
      <label class="flex items-center cursor-pointer mr-[32px]">
        <input type="radio" name="ac-prompt" class="mr-[8px]" ${AC.promptType===val?'checked':''} data-ac-prompt="${val}">
        <span class="text-[14px] text-[#333]">${label}</span>
      </label>`;
    // 指令集按钮栏
    const setBtns = AC.instructionSets.map(s=>`
      <span class="relative inline-flex items-center px-[14px] py-[6px] rounded-[6px] text-[13px] cursor-pointer mr-[8px] mb-[8px] group bg-[#f5f5f5] text-[#333]" data-ac-set="${s.id}">
        ${s.name}
        <i class="fas fa-times ml-[6px] opacity-0 group-hover:opacity-100 hover:text-[#ff4d4f]" data-ac-set-del="${s.id}"></i>
      </span>`).join('');
    const setBar = AC.promptType==='auto' ? `
      <div class="mt-[12px] flex flex-wrap items-center">
        ${setBtns}
        <span class="inline-flex items-center px-[14px] py-[6px] rounded-[6px] text-[13px] cursor-pointer mb-[8px] border border-dashed border-[#1473e6] text-[#1473e6]" data-ac-set-create><i class="fas fa-plus mr-[4px]"></i>新建指令集</span>
      </div>`:'';
    // 垫句区
    const fillers = AC.fillerSentences.map((f,i)=>`
      <div class="flex items-center mb-[8px]">
        <input class="flex-1 h-[32px] px-[12px] border border-[#d9d9d9] rounded-[6px] text-[13px]" value="${f}" data-ac-filler-idx="${i}">
        <i class="fas fa-trash-alt ml-[8px] text-[#999] cursor-pointer hover:text-[#ff4d4f]" data-ac-filler-del="${i}"></i>
      </div>`).join('');
    const fillerBox = AC.isTaskPlannerEnabled ? `
      <div class="p-[16px] bg-[#f4f8ff] rounded-[8px] mt-[16px]">
        <div class="text-[14px] text-[#333] mb-[12px]">垫句（最多5条）</div>
        ${fillers}
        <span class="text-[#1473e6] text-[13px] cursor-pointer" data-ac-filler-add><i class="fas fa-plus mr-[4px]"></i>添加垫句</span>
      </div>`:'';
    // 三步流程：示例提示词
    const EXAMPLES = {
      intent: '你是一个中文智能家居设备控制意图二分类器。\n基于【历史对话】【候选控制指令列表】【当前 query】，判断用户最新一句话是否属于"设备控制意图"。',
      planner: '# Role \n\n你是东东，京东开发的智能灯语音助手。你需要根据设备能力清单与取值范围，\n判断用户当前指令**能否在【设备能力】内直接执行**，并按下方判定规则给出 plan 决策。',
      tool: '# Role \\n你是东东，京东开发的智能灯语音助手。你的任务是分析用户的自然语言指令，理解其意图，并严格输出对应的JSON。'
    };
    const hasSet = AC.instructionSets.length > 0;
    const isAuto = AC.promptType === 'auto';
    // 三步流程
    const step = (key,title,desc)=>{
      let inner = '';
      const isTool = key==='tool';
      const toolBar = '';
      if(AC.expandedSteps[key]){
        if(isAuto && !hasSet){
          // 根据指令集生成但无指令集：不可编辑 + 框内灰色提示
          inner = `<div class="px-[16px] pb-[16px]">
            <textarea class="w-full h-[80px] p-[10px] border border-[#d9d9d9] rounded-[6px] text-[13px] bg-[#f5f5f5] text-[#999] cursor-not-allowed" disabled placeholder="当前模式下提示词由指令集生成，请新建指令集或者选择自定义提示词实现设备控制"></textarea>
          </div>`;
        } else if(isAuto && hasSet){
          // 根据指令集生成且有指令集：填入示例，可编辑
          inner = `<div class="px-[16px] pb-[16px]">${toolBar}
            <textarea ${isTool?'data-ac-tool-target':''} class="w-full h-[120px] p-[10px] border border-[#d9d9d9] rounded-[6px] text-[13px] leading-[1.6]">${EXAMPLES[key]||''}</textarea>
          </div>`;
        } else {
          // 自定义提示词：为空可输入
          inner = `<div class="px-[16px] pb-[16px]">${toolBar}
            <textarea ${isTool?'data-ac-tool-target':''} class="w-full h-[120px] p-[10px] border border-[#d9d9d9] rounded-[6px] text-[13px] leading-[1.6]" placeholder="请输入提示词"></textarea>
          </div>`;
        }
      }
      return `
      <div class="border border-[#f0f0f0] rounded-[8px] mb-[12px]">
        <div class="flex items-center justify-between px-[16px] py-[12px] cursor-pointer" data-ac-step="${key}">
          <div class="pr-[12px]">
            <div class="text-[14px] text-[#333]">${title}</div>
            ${desc?`<div class="text-[12px] text-[#999] mt-[2px] leading-[1.5]">${desc}</div>`:''}
          </div>
          <i class="fas fa-chevron-${AC.expandedSteps[key]?'up':'down'} text-[#999] shrink-0"></i>
        </div>
        ${inner}
      </div>`;
    };
    const flow = `
      <div class="mt-[16px]">
        ${step('intent','1. 意图准入判断','判断用户请求是否属于设备控制意图')}
        ${AC.isTaskPlannerEnabled?step('planner','2. 任务规划器','完成设备能力匹配、参数校验、澄清与闲聊分流，并生成任务规划。简单控制（仅单步控制，无需多轮澄清）可关闭任务规划器，可提高响应速度'):''}
        ${step('tool',(AC.isTaskPlannerEnabled?'3':'2')+'. 工具执行','将任务转化为可执行的标准工具调用')}
      </div>`;
    const dirtyBanner = (AC.promptDirty && isAuto && hasSet) ? `
      <div class="flex items-center justify-between px-[16px] py-[10px] mt-[16px] bg-[#fffbe6] border border-[#ffe58f] rounded-[8px]">
        <div class="flex items-center text-[13px] text-[#664d00]">
          <i class="fas fa-exclamation-circle text-[#faad14] mr-[8px]"></i>
          监测到指令已更新，是否同步更新提示词，更新会全量刷新并覆盖已编辑内容，重要修改建议复制备份
        </div>
        <div class="flex items-center shrink-0 ml-[16px]">
          <span class="text-[13px] text-[#1473e6] cursor-pointer mr-[16px]" data-ac-prompt-backup>复制备份</span>
          <span class="px-[12px] py-[4px] text-[13px] text-white bg-[#165DFF] rounded-[6px] cursor-pointer" data-ac-prompt-update>更新提示词</span>
        </div>
      </div>`:'';
    const body = enabled ? `
      <div class="mt-[16px]">
        <div class="text-[14px] text-[#333] mb-[12px]">提示词</div>
        <div class="flex items-center">
          ${promptRadio('auto','根据指令集生成')}
          ${promptRadio('custom','自定义提示词')}
        </div>
        ${setBar}
        ${dirtyBanner}
        <div class="flex items-center justify-between mt-[20px]">
          <div class="flex items-center">
            <span class="text-[14px] text-[#333] mr-[12px]">任务规划器</span>
            ${switchHtml('ac-planner', AC.isTaskPlannerEnabled)}
          </div>
          <div class="flex items-center">
            <span class="text-[#1473e6] text-[13px] cursor-pointer mr-[16px]" data-ac-tool-panel>工具配置</span>
            <span class="text-[#1473e6] text-[13px] cursor-pointer" data-ac-tutorial><i class="fas fa-book mr-[4px]"></i>编写教程</span>
          </div>
        </div>
        ${fillerBox}
        ${flow}
      </div>`:'';
    // 非默认智能体：产品级共享配置说明 + 跳转默认智能体入口
    const readonlyBanner = (acReadonly && enabled) ? `
      <div class="flex items-center justify-between mt-[16px]">
        <div class="flex items-center text-[13px] text-[#334155]">
          <i class="fas fa-info-circle text-[#1473e6] mr-[8px]"></i>
          AIOT 能力（指令集、提示词、工具、状态翻译）为产品级共享配置，此处仅供查看。当前智能体可控制「开启 AIoT」与技能，如需修改能力请前往默认智能体
        </div>
        ${_defAgent?`<span class="shrink-0 ml-[16px] text-[13px] text-[#1473e6] cursor-pointer hover:underline whitespace-nowrap" data-ac-goto-default="${_defAgent.id}">前往默认智能体修改<i class="fas fa-angle-right ml-[3px] text-[11px]"></i></span>`:''}
      </div>`:'';
    // 只读时用遮罩层禁用 body 内的编辑交互（AIoT 开关在标题栏，不受影响）
    const bodyWrap = (acReadonly && enabled)
      ? `<div class="relative"><div class="pointer-events-none opacity-60 select-none">${body}</div></div>`
      : body;
    return `
    <div class="mb-[32px] pt-[24px] border-t border-[#f0f0f0]">
      <div class="flex items-center justify-between mb-[16px]">
        <div class="flex items-center">
          <h2 class="text-[16px] font-medium text-[#333]">AIoT指令控制</h2>
        </div>
        <div class="flex items-center"><span class="text-[13px] text-[#666] mr-[12px]">开启AIoT</span>${switchHtml('ac-aiot', enabled)}</div>
      </div>
      ${readonlyBanner}
      ${bodyWrap}
    </div>`;
  }

          right:{ currentLumbar:0, leaveBedFlatTime:3, monitor:{ bodyRevolve:0, heartRate:59, onBedPower:3794, onBedPressure:3770, respiratoryRate:12, snoreCount:0, soundPower:150, stabilityCoefficient:4, status:1 }, selfAdaptionSetting:1, status:4, supportStrength:2, tempControlLevel:2, tempControlSwitch:0, workingPercent:0 }
        },
        motor1Angle:0, motor2Angle:0, motor3Angle:0, onlineStatus:0, stopSnoring:0, underBedLight:1, volume:60
      },
      timestamp:1785334704485
    }, null, 2);
    // 草稿：点过一次「获取上行状态」后，deviceId/token/json/表格配置按工具名持久化，重开时回填
    const draftKey = rowId || '__default__';
    if(!AC.deviceStateDraft) AC.deviceStateDraft = {};
    const draft = AC.deviceStateDraft[draftKey] || null;
    let rows = (draft && Array.isArray(draft.rows)) ? draft.rows.map(r=>({...r, map:{...(r.map||{})}})) : [];
    const esc = v => String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const saveDraft = ()=>{ AC.deviceStateDraft[draftKey] = { deviceId:(q('[data-ds-deviceid]').value||''), token:(q('[data-ds-token]').value||''), json:(q('[data-ds-json]').value||''), rows: rows.map(r=>({...r, map:{...(r.map||{})}})) }; };

    const html = `

              <span class="text-[12px] text-[#999] ml-[8px]">设备上报的原始状态数据</span>
            </div>

            </div>

          <div class="border border-[#e5e6eb] rounded-[8px] mb-[16px]">

              <span class="inline-flex w-[20px] h-[20px] rounded-full bg-[#165dff] text-white text-[12px] items-center justify-center mr-[6px]">2</span>
              <span class="text-[14px] font-medium text-[#333]">解析后配置表格</span>
              <span class="text-[12px] text-[#999] ml-[8px]">翻译标识含义 + 识别值类型 / 枚举映射</span>
            </div>

              <table class="w-full text-[12px]" style="border-collapse:collapse;table-layout:fixed">
                <thead><tr class="text-[#86909c] bg-[#fafbfc]">
                  <th class="text-left p-[8px] border-b border-[#f2f3f5]" style="width:180px">上行字段</th>
                  <th class="text-left p-[8px] border-b border-[#f2f3f5]" style="width:60px">原始值</th>
                  <th class="text-left p-[8px] border-b border-[#f2f3f5]" style="width:200px">标识含义（显示名）</th>
                  <th class="text-left p-[8px] border-b border-[#f2f3f5]" style="width:90px">值类型</th>
                  <th class="text-left p-[8px] border-b border-[#f2f3f5]">枚举映射 / 翻译结果</th>
          </tr></thead>
                <tbody data-ds-tb></tbody>
              </table>

        </div>
        <div class="flex items-center justify-end gap-[12px] px-[24px] py-[16px] border-t border-[#f0f0f0]">
          <button class="h-[34px] px-[18px] border border-[#d9d9d9] rounded-[6px] text-[14px] text-[#333] hover:bg-[#f5f5f5]" data-ds-close>取消</button>
          <button class="hidden h-[34px] px-[18px] bg-[#165DFF] text-white rounded-[6px] text-[14px]" data-ds-gen>生成翻译</button>
        </div>
      </div>`;

    const wrap = openModal(html, {});
    const q = sel => wrap.querySelector(sel);
    const tb = q('[data-ds-tb]');

    function parseJson(){
      let data;
      try { data = JSON.parse(q('[data-ds-json]').value); }
      catch(e){ showToast('JSON 解析失败：'+e.message); return; }
      // 保留层级结构：父节点(对象容器)与叶子节点都生成行，用于树形展示与折叠
      const flat = [];
      const walk = (obj, prefix, depth, parentPath)=>{
        Object.keys(obj).forEach(k=>{
          const path = prefix ? prefix+'.'+k : k;
          const v = obj[k];
          if(v!==null && typeof v==='object' && !Array.isArray(v) && Object.keys(v).length>0){
            // 非空对象 → 作为可折叠父节点，本身无业务价值（不可编辑后续列）
            flat.push({ path, label:k, depth, parentPath, raw:'', isLeaf:false });
            walk(v, path, depth+1, path);
          } else {
            // 叶子：基本类型 / 空对象 / 数组
            const raw = Array.isArray(v) ? JSON.stringify(v) : v;
            flat.push({ path, label:k, depth, parentPath, raw:raw, isLeaf:true });
          }
        });
      };
      walk(data, '', 0, '');
      rows = flat.map(n=>{
        const p = n.isLeaf ? preset[n.path] : null;
        return {
          key:n.path, label:n.label, depth:n.depth, parentPath:n.parentPath,
          raw:n.raw, isLeaf:n.isLeaf, collapsed:false,
          noValue: n.isLeaf && noValueKeys.has(n.path),
          name:p?p.name:'', type:p?p.type:'', map:(p&&p.map)?{...p.map}:{}
        };
      });
      render();
      // 已产生上行状态并解析出配置，展示「生成翻译」按钮
      const genBtn = q('[data-ds-gen]'); if(genBtn) genBtn.classList.remove('hidden');
      saveDraft();
    }
    function typeSelect(i,type){
      const opts=[['','请选择'],['enum','枚举'],['num','数值'],['switch','开关'],['text','文本'],['array','数组']];
      return `<select class="w-full border border-[#e5e6eb] rounded-[4px] px-[6px] py-[4px]" data-ds-type="${i}">`+
        opts.map(o=>`<option value="${o[0]}" ${o[0]===type?'selected':''}>${o[1]}</option>`).join('')+`</select>`;
    }
    function valueCell(i,r){
      if(r.type==='enum'||r.type==='switch'){
        let h='<div class="p-[8px] rounded-[5px] bg-[#f7faff] border border-dashed border-[#b8d3ff]">';
        Object.keys(r.map).forEach(code=>{
          h+=`<div class="flex items-center gap-[6px] mb-[5px]"><input class="border border-[#e5e6eb] rounded-[4px] px-[4px] py-[2px] font-mono" style="max-width:60px" value="${esc(code)}" data-ds-mapcode="${i}" data-ds-old="${esc(code)}"><span class="text-[#86909c]">→</span><input class="flex-1 border border-[#e5e6eb] rounded-[4px] px-[4px] py-[2px]" value="${esc(r.map[code])}" data-ds-mapval="${i}" data-ds-code="${esc(code)}"><span class="text-[#f53f3f] cursor-pointer px-[4px]" data-ds-mapdel="${i}" data-ds-dcode="${esc(code)}">✕</span></div>`;
        });
        h+=`<span class="text-[#165dff] text-[11px] cursor-pointer" data-ds-mapadd="${i}">+ 添加映射项</span>`;
        const hit=r.map[String(r.raw)];
        h+=`<div class="text-[11px] text-[#86909c] mt-[6px]">当前值 <span class="font-mono">${esc(r.raw)}</span> → <b>${hit||'（未匹配）'}</b></div></div>`;
        return h;
      }
      if(r.type==='num')  return `<div class="text-[11px] text-[#86909c]">直接取值：<b>${esc(r.raw)}</b></div>`;
      if(r.type==='text') return `<div class="text-[11px] text-[#86909c]">原样透传：<b>${esc(r.raw)}</b></div>`;
      if(r.type==='array') return `<div class="text-[11px] text-[#86909c]">数组透传：<b class="font-mono">${esc(r.raw)}</b></div>`;
      return `<span class="text-[11px] text-[#86909c]">先选择值类型 →</span>`;
    }
    function render(){
      tb.innerHTML='';
      // 判断某行是否被折叠祖先隐藏：任一祖先(parentPath 前缀链)处于 collapsed 即隐藏
      const collapsedSet = new Set(rows.filter(r=>!r.isLeaf && r.collapsed).map(r=>r.key));
      const isHidden = (r)=>{
        let p = r.parentPath;
        while(p){
          if(collapsedSet.has(p)) return true;
          const idx = p.lastIndexOf('.');
          p = idx>=0 ? p.slice(0,idx) : '';
        }
        return false;
      };
      rows.forEach((r,i)=>{
        if(isHidden(r)) return;
        const tr=document.createElement('tr');
        const pad = 8 + r.depth*16;
        // 上行字段：父节点带折叠加减号，叶子仅显示末段名
        let fieldCell;
        if(!r.isLeaf){
          const icon = r.collapsed ? '＋' : '－';
          fieldCell = `<td class="p-[8px] border-b border-[#f2f3f5] align-top" style="padding-left:${pad}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">`+
            `<span class="inline-flex w-[16px] h-[16px] items-center justify-center mr-[4px] border border-[#c9cdd4] rounded-[3px] text-[#4e5969] cursor-pointer select-none" data-ds-toggle="${i}">${icon}</span>`+
            `<span class="font-medium text-[#4e5969]">${esc(r.label)}</span></td>`;
        } else {
          fieldCell = `<td class="p-[8px] border-b border-[#f2f3f5] align-top" style="padding-left:${pad+20}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(r.key)}"><span class="font-mono bg-[#f2f3f5] px-[5px] py-[1px] rounded">${esc(r.label)}</span></td>`;
        }
        if(r.isLeaf && !r.noValue){
          tr.innerHTML = fieldCell+
            `<td class="p-[8px] border-b border-[#f2f3f5] align-top text-[#86909c]">${esc(r.raw)}</td>`+
            `<td class="p-[8px] border-b border-[#f2f3f5] align-top"><input class="w-full border border-[#e5e6eb] rounded-[4px] px-[6px] py-[4px]" value="${esc(r.name)}" placeholder="如：预设模式" data-ds-name="${i}"></td>`+
            `<td class="p-[8px] border-b border-[#f2f3f5] align-top">${typeSelect(i,r.type)}</td>`+
            `<td class="p-[8px] border-b border-[#f2f3f5] align-top">${valueCell(i,r)}</td>`;
        } else {
          // 父节点(容器) 或 无业务价值叶子：后续列置空且不可编辑
          const rawCell = r.isLeaf ? `<td class="p-[8px] border-b border-[#f2f3f5] align-top text-[#86909c]">${esc(r.raw)}</td>` : `<td class="p-[8px] border-b border-[#f2f3f5] align-top text-[#c9cdd4]">—</td>`;
          tr.innerHTML = fieldCell+ rawCell+
            `<td class="p-[8px] border-b border-[#f2f3f5] align-top text-[#c9cdd4]">—</td>`+
            `<td class="p-[8px] border-b border-[#f2f3f5] align-top text-[#c9cdd4]">—</td>`+
            `<td class="p-[8px] border-b border-[#f2f3f5] align-top text-[#c9cdd4]">—</td>`;
        }
        tb.appendChild(tr);
      });
    }
    // 生成 Jinja2 模板片段：数值/文本直接取值，枚举/开关走 <key>_map 映射
    function tplExpr(r){
      // r.key 已是完整点路径（如 data.volume、data.mattress.left.monitor.heartRate）
      const mapVar = r.key.split('.').join('_')+'_map'; // 映射变量名去点，避免 Jinja 变量名非法
      if(r.type==='enum'||r.type==='switch') return `{{ ${mapVar}[${r.key} | string] }}`;
      if(r.type==='num'||r.type==='text'||r.type==='array')    return `{{ ${r.key} }}`;
      return null;
    }

    // 有草稿则回填 deviceId/token/json 与已解析表格（点过一次「获取上行状态」后内容保留）
    if(draft){
      if(draft.deviceId) q('[data-ds-deviceid]').value = draft.deviceId;
      if(draft.token) q('[data-ds-token]').value = draft.token;
      if(draft.json) q('[data-ds-json]').value = draft.json;
      if(rows.length){ render(); const genBtn = q('[data-ds-gen]'); if(genBtn) genBtn.classList.remove('hidden'); }
    }

    wrap.addEventListener('click', e=>{
      const t=e.target;
      if(t.closest('[data-ds-close]')){ wrap.remove(); return; }
      if(t.closest('[data-ds-parse]')){
        const did=(q('[data-ds-deviceid]').value||'').trim();
        const tok=(q('[data-ds-token]').value||'').trim();
        if(!did||!tok){ showToast('请先填写 deviceId 和 token'); return; }
        // 模拟拉取设备上行状态：回填示例 JSON（只读展示）后解析生成配置表格
        q('[data-ds-json]').value = defaultJson;
        parseJson(); return;
      }
      const tg=t.closest('[data-ds-toggle]'); if(tg){ const i=+tg.getAttribute('data-ds-toggle'); rows[i].collapsed=!rows[i].collapsed; render(); saveDraft(); return; }
      const add=t.closest('[data-ds-mapadd]'); if(add){ rows[+add.getAttribute('data-ds-mapadd')].map['']=''; render(); saveDraft(); return; }
      const del=t.closest('[data-ds-mapdel]'); if(del){ delete rows[+del.getAttribute('data-ds-mapdel')].map[del.getAttribute('data-ds-dcode')]; render(); saveDraft(); return; }
      if(t.closest('[data-ds-gen]')){
        const valid = rows.filter(r=>r.name && r.type);
        // 模板句子：显示名={{ 表达式 }}
        const tplParts = valid.map(r=>`${r.name}=${tplExpr(r)}`).filter(Boolean);
        if(!tplParts.length){ showToast('暂无可生成内容，请先填写显示名并选择值类型'); return; }
        const template = '> **当前设备状态**：'+tplParts.join(' ');
        // 收集枚举/开关字段的映射表，变量名与 tplExpr 中 mapVar 保持一致
        const mappings = {};
        valid.forEach(r=>{
          if(r.type==='enum'||r.type==='switch'){
            const mapVar = r.key.split('.').join('_')+'_map';
            const m = {};
            Object.keys(r.map||{}).forEach(code=>{ if(code!=='') m[code]=r.map[code]; });
            mappings[mapVar] = m;
          }
        });
        // 生成运行时配置 JSON（postHandler=templateRender）
        const out = JSON.stringify({ postHandler:'templateRender', templateRender:{ mappings, template } }, null, 2);
        // 通过回调写回到调用方（工具面板草稿）
        if(typeof onDone === 'function') onDone(out);
        wrap.remove();
      }
    });
    wrap.addEventListener('input', e=>{
      const t=e.target, i=+t.getAttribute('data-ds-name');
      if(t.hasAttribute('data-ds-deviceid')||t.hasAttribute('data-ds-token')){ saveDraft(); return; }
      if(t.hasAttribute('data-ds-name')){ rows[i].name=t.value; saveDraft(); return; }
      if(t.hasAttribute('data-ds-mapval')){ rows[+t.getAttribute('data-ds-mapval')].map[t.getAttribute('data-ds-code')]=t.value; saveDraft(); return; }
    });
    wrap.addEventListener('change', e=>{
      const t=e.target;
      if(t.hasAttribute('data-ds-type')){
        const i=+t.getAttribute('data-ds-type'); rows[i].type=t.value;
        if((t.value==='enum'||t.value==='switch') && Object.keys(rows[i].map).length===0){
          rows[i].map = t.value==='switch' ? {'0':'关闭','1':'开启'} : {[String(rows[i].raw)]:''};
        }
        render(); saveDraft(); return;
      }
      if(t.hasAttribute('data-ds-mapcode')){
        const i=+t.getAttribute('data-ds-mapcode'), oldC=t.getAttribute('data-ds-old'), newC=t.value;
        if(newC!==oldC){ const v=rows[i].map[oldC]; delete rows[i].map[oldC]; rows[i].map[newC]=v; render(); saveDraft(); }
        return;
      }
    });
  }

            <i class="fas fa-pen text-[#86909c] text-[13px] ml-[6px] cursor-pointer hover:text-[#1473e6]" id="acset-title-edit"></i>
          </div>
        </div>
        <div class="flex items-center justify-between px-[24px] pt-[12px] border-b border-[#f0f0f0]">
          <div class="flex gap-[20px] text-[13px]" data-set-tabs>
            <span class="pb-[8px] cursor-pointer" data-set-tab="list">指令列表</span>${((State.currentAppData||{}).iotPlatform==='集贤')?'':'<span class="pb-[8px] cursor-pointer" data-set-tab="schedule">定时指令</span><span class="pb-[8px] cursor-pointer" data-set-tab="batch">批量测试</span>'}
          </div>
          <div class="flex items-center pb-[6px]" data-set-topbtn></div>
        </div>
        <div class="flex-1 overflow-y-auto p-[24px]" data-set-body></div>
      </div>`, { widthClass:'w-3/4', onMount:(w)=>{
        const ti=w.querySelector('#acset-title');
        const tiText=w.querySelector('#acset-title-text');
        const tiEdit=w.querySelector('#acset-title-edit');
        if(ti){
          const commit=()=>{
            const nm=ti.value.trim();
            if(nm && nm!==s.name){ s.name=nm; AC.promptDirty=true; renderApp(); }
            if(tiText){ tiText.textContent=s.name; tiText.classList.remove('hidden'); }
            ti.classList.add('hidden');
          };
          ti.addEventListener('blur',commit);
          ti.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); ti.blur(); } });
        }
        if(tiEdit && ti) tiEdit.addEventListener('click',()=>{
          if(tiText) tiText.classList.add('hidden');
          ti.classList.remove('hidden'); ti.focus(); ti.select();
        });
        // tab 切换：抽屉内局部刷新，不重建抽屉
        if((State.currentAppData||{}).iotPlatform==='集贤' && AC.acSetTab!=='list') AC.acSetTab='list';
        w.querySelectorAll('[data-set-tab]').forEach(b=>b.addEventListener('click',()=>{ AC.acSetTab=b.getAttribute('data-set-tab'); acSetRenderTab(w,s); }));
        acSetRenderTab(w,s);
      } });
  }

  // 局部刷新：只更新 body 内容 + tab 高亮 + 头部按钮 + 重绑当前 tab 事件，不销毁抽屉
  function acSetRenderTab(w,s){
    let tab=AC.acSetTab||'list';
    if((State.currentAppData||{}).iotPlatform==='集贤' && tab!=='list') tab=AC.acSetTab='list';
    let body='', topBtn='';
    if(tab==='list'){ body=acSetListBodyHtml(s); topBtn=''; }
    else if(tab==='schedule'){ body=acSetScheduleBodyHtml(s); topBtn=`<button class="h-[34px] px-[18px] bg-[#165DFF] text-white rounded-[6px] text-[14px] font-medium hover:bg-[#1266d1]" data-set-save>保存并发布</button>`; }
    else { body=acSetBatchBodyHtml(s); topBtn=`<button class="h-[34px] px-[18px] bg-[#165DFF] text-white rounded-[6px] text-[14px] font-medium hover:bg-[#1266d1]" data-bt-add><i class="fas fa-plus mr-[6px]"></i>新建测试任务</button>`; }
    // tab 高亮
    w.querySelectorAll('[data-set-tab]').forEach(sp=>{ const on=sp.getAttribute('data-set-tab')===tab;
      sp.classList.toggle('border-b-2',on); sp.classList.toggle('border-[#1473e6]',on); sp.classList.toggle('text-[#1473e6]',on); sp.classList.toggle('text-[#666]',!on); });
    // 头部按钮
    const tb=w.querySelector('[data-set-topbtn]'); if(tb) tb.innerHTML=topBtn;
    // body 内容（innerHTML 替换会丢弃旧监听，安全）
    const bd=w.querySelector('[data-set-body]'); if(bd) bd.innerHTML=body;
    // 重绑当前 tab 事件
    if(tab==='list') acSetListMount(w,s);
    else if(tab==='schedule') acSetScheduleMount(w,s);
    else acSetBatchMount(w,s);
  }

  function acSetListMount(w,s){
    const addBtn=w.querySelector('[data-ins-add]');
    if(addBtn) addBtn.addEventListener('click',()=>{ w.remove(); acInstructionEditDrawer(s.id, null); });
    w.querySelectorAll('[data-ins-edit]').forEach(b=>b.addEventListener('click',()=>{
      const id=b.getAttribute('data-ins-edit');
      const inst=(AC.instructionsBySet[s.id]||[]).find(x=>x.id===id);
      w.remove(); acInstructionEditDrawer(s.id, inst);
    }));
    w.querySelectorAll('[data-ins-del]').forEach(b=>b.addEventListener('click',()=>{
      const id=b.getAttribute('data-ins-del');
      confirmModal({ title:'删除指令', content:'确定删除该指令吗？', onConfirm:()=>{
        AC.instructionsBySet[s.id]=(AC.instructionsBySet[s.id]||[]).filter(x=>x.id!==id);
        AC.promptDirty=true; acSetRenderTab(w,s);
      } });
    }));
  }

  function acSetScheduleMount(w,s){
    const sc=AC.scheduleBySet[s.id]; if(!sc) return;
    // 能力开关（受控 data-switch，手动绑定）
    ['create','cancel','cancelNext','query'].forEach(k=>{ const el=w.querySelector('[data-switch="sc-'+k+'"]'); if(el){ el.setAttribute('data-controlled','1'); el.addEventListener('click',()=>{ sc[k]=!sc[k]; el.classList.toggle('on',sc[k]); }); } });
    // 类型 / 粒度 checkbox
    w.querySelectorAll('[data-sc-chk]').forEach(cb=>cb.addEventListener('change',()=>{
      const k=cb.getAttribute('data-sc-chk');
      if(k==='once') sc.once=cb.checked;
      else if(k==='cycle'){ sc.cycle=cb.checked; sc.grains.day=cb.checked; acSetRenderTab(w,s); return; }
    }));
    // 添加定时执行指令：从指令列表挑选
    const scAdd=w.querySelector('[data-sc-add]');
    if(scAdd) scAdd.addEventListener('click',()=>acSchedulePickCmd(w,s,sc));
    w.querySelectorAll('[data-sc-del]').forEach(b=>b.addEventListener('click',()=>{
      const idx=+b.getAttribute('data-sc-del'); sc.cmds.splice(idx,1); acSetRenderTab(w,s);
    }));
    const save=w.querySelector('[data-set-save]');
    if(save) save.addEventListener('click',()=>{ AC.promptDirty=true; showToast('定时指令已保存并发布'); });
  }

      </div>`, { onMount:(m)=>{
        m.querySelectorAll('[data-mclose]').forEach(b=>b.addEventListener('click',()=>m.remove()));
        m.querySelector('[data-mok]').addEventListener('click',()=>{
          m.querySelectorAll('[data-pick]:checked').forEach(cb=>{ const i=list.find(x=>x.id===cb.getAttribute('data-pick')); if(i && !sc.cmds.some(c=>c.code===i.code)) sc.cmds.push({ name:i.name, code:i.code, type:i.type==='控制项指令'?'控制项':'非控制项' }); });

              <label class="flex items-center cursor-pointer"><input type="radio" name="ins-send" value="IOT平台" ${(inst&&inst.send==='IOT平台')?'checked':''} class="mr-[6px]">IOT平台</label>

  function acInsEditMount(w, setId, inst, sentenceData, esc){
    const splitS = (str)=>str.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
    const renderAction = (row)=>{
      const name = row.getAttribute('data-action');
      const checked = row.querySelector('[data-action-cb]').checked;
      const box = row.querySelector('.action-content');
      box.innerHTML='';
      if(!checked) return;
      const d = sentenceData[name];
      const hasPos = d && d.positive && d.positive.length>0;
      if(!hasPos){
        box.innerHTML = `<span class="text-[#1473e6] text-[13px] cursor-pointer" data-ex-open="${esc(name)}">添加例句</span><span class="text-[#ff4d4f] text-[13px] ml-[12px]">必填，请至少添加1条例句</span>`;
      } else {
        const posText = d.positive.join('，');
        const negText = (d.negative||[]).join('，');
        const full = '正例：'+posText+(negText?'　反例：'+negText:'');
        let summary = `<span class="text-[#999]">正例：</span>${esc(posText)}`;
        if(negText) summary += `<span class="text-[#999] ml-[12px]">反例：</span>${esc(negText)}`;
        box.innerHTML = `<div class="flex items-center text-[13px]"><span class="truncate max-w-[70%]" title="${esc(full)}">${summary}</span><span class="text-[#1473e6] cursor-pointer ml-[12px] shrink-0" data-ex-open="${esc(name)}">编辑</span></div>`;
      }
    };
    const renderAll = ()=>{ w.querySelectorAll('[data-action]').forEach(renderAction); };
    const openEx = (name)=>{
      const d = sentenceData[name] || { positive:[], negative:[] };
      const mh = `
        <div class="w-[520px] bg-white rounded-[8px] shadow-xl overflow-hidden">
          <div class="flex items-center justify-between px-[24px] py-[16px] border-b border-[#f0f0f0]"><h3 class="text-[16px] font-medium">例句配置</h3><i class="fas fa-times text-[#999] cursor-pointer" data-close></i></div>
          <div class="p-[24px]">
            <div class="mb-[16px]"><div class="text-[13px] text-[#333] mb-[8px]"><span class="text-[#ff4d4f]">*</span> 正例</div>
              <textarea id="ex-pos" class="w-full h-[80px] p-[10px] border border-[#d9d9d9] rounded-[6px] text-[13px]" placeholder="请输入正例，多条例子用逗号隔开">${esc(d.positive.join('，'))}</textarea>
              <div id="ex-err" class="text-[#ff4d4f] text-[12px] mt-[4px]" style="display:none">正例必填，请至少填写1条</div></div>
            <div><div class="text-[13px] text-[#333] mb-[8px]">反例</div>
              <textarea id="ex-neg" class="w-full h-[80px] p-[10px] border border-[#d9d9d9] rounded-[6px] text-[13px]" placeholder="请输入反例（选填），多条例子用逗号隔开">${esc((d.negative||[]).join('，'))}</textarea></div>
          </div>
     <div class="flex justify-end gap-[12px] px-[24px] py-[16px] border-t border-[#f0f0f0]">
            <button class="h-[32px] px-[16px] border border-[#d9d9d9] rounded-[6px] text-[13px]" data-close>取消</button>
            <button id="ex-ok" class="h-[32px] px-[16px] bg-[#165DFF] text-white rounded-[6px] text-[13px]">确定</button>
          </div>
        </div>`;
      const mw = openModal(mh, { zClass:'z-[120]' });
      mw.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>mw.remove()));
      mw.querySelector('#ex-ok').addEventListener('click',()=>{
        const positive = splitS(mw.querySelector('#ex-pos').value);
        if(positive.length===0){ mw.querySelector('#ex-err').style.display='block'; return; }
        const negative = splitS(mw.querySelector('#ex-neg').value);
        sentenceData[name] = { positive, negative };
        mw.remove(); renderAll();
      });
    };
    w.querySelector('#ins-actionbox').addEventListener('click',(e)=>{
      const openBtn = e.target.closest('[data-ex-open]');
      if(openBtn){ openEx(openBtn.getAttribute('data-ex-open')); return; }
      const delBtn = e.target.closest('[data-action-del]');
      if(delBtn){ const row=delBtn.closest('[data-action]'); if(row) row.remove(); return; }
      if(e.target.closest('[data-action-add]')){
        const box = w.querySelector('#ins-actionbox');
        const addBtn = box.querySelector('[data-action-add]');
        const key = 'custom-'+Date.now();
        const row = document.createElement('div');
        row.className='border-b border-[#f0f0f0] py-[10px] flex items-center'; row.setAttribute('data-action',key);
        row.innerHTML = `<i class="far fa-minus-circle text-[#999] cursor-pointer mr-[10px] shrink-0" data-action-del></i>`+
          `<input type="checkbox" checked class="hidden" data-action-cb>`+
          `<div class="relative shrink-0"><input type="text" maxlength="20" class="w-[220px] h-[34px] pl-[12px] pr-[52px] border border-[#d9d9d9] rounded-[6px] text-[13px] outline-none focus:border-[#1473e6]" placeholder="请输入操作行为" data-action-name><span class="absolute right-[12px] top-1/2 -translate-y-1/2 text-[12px] text-[#bbb] pointer-events-none" data-action-count>0 / 20</span></div>`+
          `<div class="action-content ml-[16px] flex-1"></div>`;
        box.insertBefore(row, addBtn); renderAction(row);
        const nameInput = row.querySelector('[data-action-name]');
        nameInput.focus();
      }
    });
    w.querySelector('#ins-actionbox').addEventListener('change',(e)=>{
      const cb = e.target.closest('[data-action-cb]');
      if(cb) renderAction(cb.closest('[data-action]'));
    });
    w.querySelector('#ins-actionbox').addEventListener('input',(e)=>{
      const ni = e.target.closest('[data-action-name]');
      if(ni){ const row=ni.closest('[data-action]'); const cnt=row&&row.querySelector('[data-action-count]'); if(cnt) cnt.textContent=(ni.value.length)+' / 20'; }
    });    w.querySelectorAll('[data-ins-back]').forEach(b=>b.addEventListener('click',()=>{ AC.acSetTab='list'; w.remove(); acInstructionSetDrawer(); }));
    w.querySelector('[data-ins-save]').addEventListener('click',()=>{
      const name = w.querySelector('#ins-name').value.trim();
      const code = w.querySelector('#ins-code').value.trim();
      if(!name){ showToast('请输入指令控制项'); return; }
      if(!code){ showToast('请输入控制项编码'); return; }
      const dataType = (w.querySelector('input[name="ins-dtype"]:checked')||{}).value||'开关';
      const send = (w.querySelector('input[name="ins-send"]:checked')||{}).value||'端侧';
      const alias = w.querySelector('#ins-alias').value.trim();
      const actions = Array.from(w.querySelectorAll('[data-action]')).filter(r=>r.querySelector('[data-action-cb]').checked).map(r=>{ const ni=r.querySelector('[data-action-name]'); return ni? ni.value.trim() : r.getAttribute('data-action'); }).filter(Boolean);
      const obj = { id: inst? inst.id : 'ins-'+Date.now(), name, code, alias, dataType, send,
        type:'控制项指令', actions, silent:false, sentenceData,
        createdAt: inst? inst.createdAt : new Date().toLocaleString('zh-CN') };
      if(!AC.instructionsBySet[setId]) AC.instructionsBySet[setId]=[];
      if(inst){ const i=AC.instructionsBySet[setId].findIndex(x=>x.id===inst.id); if(i>=0) AC.instructionsBySet[setId][i]=obj; }
      else { AC.instructionsBySet[setId].push(obj); }
      AC.promptDirty=true; w.remove(); renderApp(); acInstructionSetDrawer();
      showToast(inst?'指令已更新':'指令已创建');
    });
    renderAll();
  }

          ${item('2','任务规划器 · 任务拆解 / 需求澄清 / 参数提取','把整句拆成一个或多个子任务；对信息不全的表达发起澄清；从自然语言中提取执行所需的关键参数，并决定调用顺序与依赖。它承上启下，把用户的一句话整理成执行层能直接消费的清晰任务。该层可按需开启或关闭。')}
          ${item('3','工具执行 · 按结构化协议出参数','对具体子任务生成符合协议的结构化输出（如 intent/args/deviceTimerBody），交给设备侧执行。它是链路的最终出口，直接对接设备能力。')}

  // 生成唯一行 id
  function acGenToolId(){ return 'ut-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  // 移除工具行：从 usedTools 剔除并删除其运行时配置（不改动提示词，工具与提示词不联动）
  function acRemoveToolRow(id){
    AC.usedTools = (AC.usedTools||[]).filter(r => r.id !== id);
    if(AC.toolRuntimeConfig) delete AC.toolRuntimeConfig[id];
  }
  // 工具面板：左列表右表单；新建/编辑为「草稿态」——未点「确定」不写入 usedTools，切走即丢弃
  function acToolPanelDrawer(){
    const tools = AC.tools || [];
    if(!tools.length){ showToast('暂无可用系统工具'); return; }
    if(!Array.isArray(AC.usedTools)) AC.usedTools = [];
    const esc = v => String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const findTool = n => tools.find(t=>t.name===n);
    // 左侧列表项：工具名 + 底层工具描述 两行展示（hover 显示删除）
    const listItem = (row, active)=>{
      const bt = findTool(row.tool);
      const title = (row.name||'').trim() || (bt ? bt.name : '') || '未命名工具';
      const sub = (row.desc||'').trim() || (bt ? bt.desc : '');
      return `
      <div class="group px-[16px] py-[12px] cursor-pointer border-l-[3px] ${active?'bg-[#f4f8ff] border-[#165DFF]':'border-transparent hover:bg-[#fafafa]'}" data-tool-item="${row.id}">
        <div class="flex items-center justify-between">
          <span class="truncate text-[14px] ${active?'text-[#165DFF]':'text-[#333]'}">${esc(title)}</span>
          <i class="fas fa-trash-alt text-[#c9cdd4] hover:text-[#f53f3f] text-[12px] ml-[8px] opacity-0 group-hover:opacity-100 shrink-0" data-tool-remove="${row.id}"></i>
        </div>
        ${sub?`<div class="text-[12px] text-[#999] mt-[2px] truncate">${esc(sub)}</div>`:''}
      </div>`;
    };
    const renderListHtml = (activeId)=>{
      const arr = AC.usedTools||[];
      if(!arr.length) return '';
      return arr.map(r=>listItem(r, r.id===activeId)).join('');
    };
    // 「选择工具」下拉：自定义面板，每项 工具名 + 默认描述 两行
    const selectOptions = (sel)=> tools.map(t=>`
      <div class="px-[12px] py-[8px] cursor-pointer hover:bg-[#f4f8ff] ${t.name===sel?'bg-[#f4f8ff]':''}" data-tool-opt="${esc(t.name)}">
        <div class="text-[14px] text-[#333]">${esc(t.name)}</div>
        <div class="text-[12px] text-[#999] mt-[2px] truncate">${esc(t.desc||'')}</div>
      </div>`).join('');
    // 右侧详情：表单（名称必填 / 描述可空 / 选择工具下拉 / 运行时配置 / 确定+取消）；draft 为草稿对象
    const detail = (draft)=>{
      if(!draft) return `<div class="text-[13px] text-[#999]">${(AC.usedTools||[]).length?'请选择左侧工具，或点击右上角「添加工具」。':'暂无工具，点击右上角「添加工具」开始配置。'}</div>`;
      const rtCfg = draft.runtime || '';
      const selText = draft.tool ? esc(draft.tool) : '<span class="text-[#999]">请选择工具</span>';
      const errName = draft.errName ? `<div class="text-[12px] text-[#f53f3f] mt-[4px]">请输入工具名称</div>` : '';
      const errTool = draft.errTool ? `<div class="text-[12px] text-[#f53f3f] mt-[4px]">请选择工具</div>` : '';
      // 运行时配置区：始终展示（未选工具也可编辑）
      const rtBlock = `
        <div class="mb-[8px]"><div class="flex items-center justify-between mb-[6px]"><div class="text-[13px] text-[#333]">运行时配置</div>
          <span class="text-[#1473e6] text-[13px] cursor-pointer shrink-0" data-panel-config><i class="fas fa-cog mr-[4px]"></i>解析并配置翻译</span></div>
          <div class="text-[12px] text-[#999] mb-[8px]">工具执行后的额外配置，如状态码转译模版、字段映射等。</div>
          <textarea class="w-full h-[180px] p-[10px] border border-[#e5e6eb] rounded-[6px] text-[12px] font-mono leading-[1.6] bg-[#f7f8fa] text-[#4e5969]" placeholder="点击「解析并配置翻译」生成运行时配置，或手动编写 JSON" data-tool-runtime>${esc(rtCfg)}</textarea>
        </div>`;
      return `
        <div class="flex-1 overflow-y-auto pr-[2px]">
          <div class="mb-[20px]"><div class="text-[13px] text-[#333] mb-[6px]">名称 <span class="text-[#f53f3f]">*</span></div>
            <input class="w-full h-[38px] px-[12px] border ${draft.errName?'border-[#f53f3f]':'border-[#e5e6eb]'} rounded-[6px] text-[14px]" placeholder="输入工具名称" value="${esc(draft.name||'')}" data-tool-name>${errName}</div>
          <div class="mb-[20px]"><div class="text-[13px] text-[#333] mb-[6px]">描述</div>
            <textarea class="w-full h-[80px] px-[12px] py-[10px] border border-[#e5e6eb] rounded-[6px] text-[14px] leading-[1.6]" placeholder="输入工具描述（留空将使用默认描述）" data-tool-desc>${esc(draft.desc||'')}</textarea></div>
          <div class="mb-[20px]"><div class="text-[13px] text-[#333] mb-[6px]">选择工具 <span class="text-[#f53f3f]">*</span></div>
            <div class="relative" data-tool-select-wrap>
              <div class="w-full h-[38px] px-[12px] border ${draft.errTool?'border-[#f53f3f]':'border-[#e5e6eb]'} rounded-[6px] text-[14px] bg-white flex items-center justify-between cursor-pointer" data-tool-select-btn>
                <span class="truncate">${selText}</span><i class="fas fa-chevron-down text-[#999] text-[12px] ml-[8px]"></i></div>
              <div class="hidden absolute left-0 right-0 top-[42px] z-[20] max-h-[240px] overflow-y-auto bg-white border border-[#e5e6eb] rounded-[6px] shadow-lg" data-tool-select-list>${selectOptions(draft.tool)}</div>
            </div>
            ${errTool}
            <div class="text-[12px] text-[#999] mt-[6px]">从当前 iot 平台可用工具中选择要使用的工具。</div></div>
          ${rtBlock}
        </div>
        <div class="pt-[14px] mt-[4px] border-t border-[#f0f0f0] flex justify-end shrink-0">
          <button class="h-[36px] px-[24px] border border-[#d9d9d9] rounded-[6px] text-[14px] text-[#333] mr-[12px] hover:bg-[#f5f5f5]" data-tool-cancel>取消</button>
          <button class="h-[36px] px-[24px] bg-[#165DFF] text-white rounded-[6px] text-[14px]" data-tool-confirm>确定</button>
        </div>`;
    };
    const html = `
      <div class="h-full flex flex-col">
        <div class="relative flex items-center justify-between px-[24px] py-[16px] border-b border-[#f0f0f0]">
          <h3 class="text-[16px] font-medium text-[#333]">工具</h3>
          <button class="h-[32px] px-[14px] bg-[#165DFF] text-white text-[13px] rounded-[6px]" data-tool-add-btn><i class="fas fa-plus mr-[4px]"></i>添加工具</button>
        </div>
        <div class="flex-1 flex overflow-hidden">
          <div class="w-[220px] border-r border-[#f0f0f0] overflow-y-auto py-[8px]" data-tool-list>${renderListHtml(null)}</div>
          <div class="flex-1 overflow-hidden px-[24px] py-[20px] flex flex-col" data-tool-detail>${detail(null)}</div>
        </div>
      </div>`;
    openDrawer(html, { widthClass:'w-[820px]', onMount:(w)=>{
      const detailBox = w.querySelector('[data-tool-detail]');
      const listBox = w.querySelector('[data-tool-list]');
      const addBtn = w.querySelector('[data-tool-add-btn]');
      // 草稿态：draft 为当前编辑对象（新建/编辑均先在此，点确定才写入 usedTools）；activeId 为列表高亮
      let draft = null;       // { id, name, desc, tool, runtime, isNew }
      let activeId = null;    // 当前编辑/高亮的已保存行 id
      const rerender = ()=>{ listBox.innerHTML = renderListHtml(activeId); detailBox.innerHTML = detail(draft); bindDetail(); };
      // 编辑已保存行：拷贝为草稿
      const editRow = (id)=>{
        const row = (AC.usedTools||[]).find(r=>r.id===id);
        if(!row) return;
        draft = { id: row.id, name: row.name||'', desc: row.desc||'', tool: row.tool||'', runtime: ((AC.toolRuntimeConfig||{})[row.id])||'', isNew:false };
        activeId = id;
        rerender();
      };
      // 提交草稿到 usedTools
      const commitDraft = ()=>{
        if(!draft) return;
        // 内联必填校验：不通过则在字段下红字提示，不写入
        draft.errName = !(draft.name||'').trim();
        draft.errTool = !draft.tool;
        if(draft.errName || draft.errTool){ rerender(); return; }
        // 描述为空则写入所选工具的默认描述
        let descVal = (draft.desc||'').trim();
        if(!descVal){ const bt = findTool(draft.tool); descVal = bt ? (bt.desc||'') : ''; draft.desc = descVal; }
        const payload = { id: draft.id, name: draft.name.trim(), desc: descVal, tool: draft.tool };
        const idx = (AC.usedTools||[]).findIndex(r=>r.id===draft.id);
        if(idx>=0) AC.usedTools[idx] = payload; else AC.usedTools.push(payload);
        if(!AC.toolRuntimeConfig) AC.toolRuntimeConfig={};
        if((draft.runtime||'').trim()) AC.toolRuntimeConfig[draft.id] = draft.runtime; else delete AC.toolRuntimeConfig[draft.id];
        activeId = draft.id;
        // 确定后保持编辑态：draft 不置空，右侧继续展示当前工具内容
        draft.isNew = false;
        draft.errName = false;
        draft.errTool = false;
        rerender();
        showToast('已保存');
      };
      // 添加工具：新建空草稿（不写入 usedTools，未确定切走即丢弃）
      addBtn.addEventListener('click',(e)=>{
        e.stopPropagation();
        draft = { id: acGenToolId(), name:'', desc:'', tool:'', runtime:'', isNew:true };
        activeId = null;
        rerender();
        const ni = detailBox.querySelector('[data-tool-name]');
        if(ni) ni.focus();
      });
      // 左列表：删除（二次确认）/ 选中编辑
      listBox.addEventListener('click',(e)=>{
        const rm = e.target.closest('[data-tool-remove]');
        if(rm){
          e.stopPropagation();
          const id = rm.getAttribute('data-tool-remove');
          const row = (AC.usedTools||[]).find(r=>r.id===id);
          const nm = row ? ((row.name||row.tool)||'该工具') : '该工具';
          confirmModal({ title:'删除工具', content:`确定删除「${nm}」吗？`, hint:'删除后其运行时配置也将一并移除，且不可恢复。', onConfirm:()=>{
            acRemoveToolRow(id);
            // 删除后右侧回落到第一个工具，避免空白；无工具则清空
            const first = (AC.usedTools||[])[0];
            if(first){ editRow(first.id); } else { draft=null; activeId=null; rerender(); }
          }});
          return;
        }
        const it = e.target.closest('[data-tool-item]');
        if(!it) return;
        editRow(it.getAttribute('data-tool-item'));  // 切换编辑其他行，未确认的草稿被丢弃
      });
      // 右侧表单事件绑定（每次重绘后重新绑定）
      function bindDetail(){
        if(!draft) return;
        const nameInput = detailBox.querySelector('[data-tool-name]');
        const descInput = detailBox.querySelector('[data-tool-desc]');
        const rtInput = detailBox.querySelector('[data-tool-runtime]');
        const confirmBtn = detailBox.querySelector('[data-tool-confirm]');
        const cancelBtn = detailBox.querySelector('[data-tool-cancel]');
        const selBtn = detailBox.querySelector('[data-tool-select-btn]');
        const selList = detailBox.querySelector('[data-tool-select-list]');
        const cfgBtn = detailBox.querySelector('[data-panel-config]');
        if(nameInput) nameInput.addEventListener('input',()=>{ draft.name = nameInput.value; if(draft.errName && draft.name.trim()){ draft.errName=false; rerender(); } });
        if(descInput) descInput.addEventListener('input',()=>{ draft.desc = descInput.value; });
        if(rtInput) rtInput.addEventListener('input',()=>{ draft.runtime = rtInput.value; });
        if(confirmBtn) confirmBtn.addEventListener('click', commitDraft);
        if(cancelBtn) cancelBtn.addEventListener('click',()=>{
          // 取消编辑：回落到第一个已保存工具，右侧不留空白；无工具则清空
          const first = (AC.usedTools||[])[0];
          if(first){ editRow(first.id); } else { draft=null; activeId=null; rerender(); }
        });
        if(selBtn && selList){
          selBtn.addEventListener('click',(ev)=>{ ev.stopPropagation(); selList.classList.toggle('hidden'); });
          selList.addEventListener('click',(ev)=>{
            const opt = ev.target.closest('[data-tool-opt]');
            if(!opt) return;
            draft.tool = opt.getAttribute('data-tool-opt');
            draft.errTool = false;
            detailBox.innerHTML = detail(draft); bindDetail();   // 切工具影响运行时配置区
          });
        }
        if(cfgBtn) cfgBtn.addEventListener('click',()=>{
          if(!(draft.name||'').trim()){ showToast('请先填写工具名称'); return; }
          acDeviceStateModal(draft.id, (out)=>{ draft.runtime = out; const ta=detailBox.querySelector('[data-tool-runtime]'); if(ta) ta.value = out; }, (draft.name||'').trim());
        });
      }
      // 点击面板空白关闭下拉
      detailBox.addEventListener('click',(e)=>{
        const list = detailBox.querySelector('[data-tool-select-list]');
        if(list && !list.classList.contains('hidden') && !e.target.closest('[data-tool-select-wrap]')) list.classList.add('hidden');
      });
      // 初始态：默认选中列表第一个工具并展示其详情（省略手动点选）
      const firstRow = (AC.usedTools||[])[0];
      if(firstRow){ editRow(firstRow.id); } else { bindDetail(); }
    } });
  }

  /* ================= 事件绑定 ================= */
  window.PageEvents.appConfig = function(){
    const app = document.getElementById('app');
    // 统一点击委托（用 onclick 覆盖式绑定，避免 renderApp 后监听器累积导致需多次点击）
    app.onclick = function(e){
      const t = e.target;
      // switch 开关
      const sw = t.closest('[data-switch]');
      if(sw){
        const id = sw.getAttribute('data-switch');
        if(id==='ac-aiot'){ AC.aiotEnabled=!AC.aiotEnabled; renderApp(); return; }
        if(id==='ac-planner'){ AC.isTaskPlannerEnabled=!AC.isTaskPlannerEnabled; renderApp(); return; }
        if(id && id.indexOf('ac-strat-')===0){ const k=id.replace('ac-strat-',''); AC.strategies[k]=!AC.strategies[k]; renderApp(); return; }
      }
      if(t.closest('[data-ac-go-index]')){ setCurrentPage('index'); return; }
      if(t.closest('[data-ac-toggle-info]')){ AC.productInfoExpanded=!AC.productInfoExpanded; renderApp(); return; }
      if(t.closest('[data-ac-hotword]')){ acHotWordModal(); return; }
      if(t.closest('[data-ac-save-draft]')){ acSaveToast('草稿已保存'); AC.saveToast='草稿已保存'; renderApp(); setTimeout(()=>{ AC.saveToast=''; },2400); return; }
      // 智能体
      const agent = t.closest('[data-ac-agent]');
      if(agent){ acSwitchAgent(agent.getAttribute('data-ac-agent')); renderApp(); return; }
      const gotoDef = t.closest('[data-ac-goto-default]');
      if(gotoDef){ acSwitchAgent(gotoDef.getAttribute('data-ac-goto-default')); renderApp(); return; }
      if(t.closest('[data-ac-agent-create]')){
        if(AC.agents.length>=10){ showToast('智能体数量已达上限'); return; }
        acSnapshotAgent(AC.activeAgentId);
        const id='agent-'+Date.now();
        AC.agents.push({ id, name:'新智能体', isDefault:false });
        AC.activeAgentId=id;
        acLoadAgent(id); // 新智能体使用默认空配置，不继承其它智能体已编辑内容
        renderApp(); return;
      }
      const setDef = t.closest('[data-ac-agent-setdefault]');
      if(setDef){ const id=setDef.getAttribute('data-ac-agent-setdefault'); AC.agents.forEach(a=>a.isDefault=(a.id===id)); renderApp(); return; }
      const ren = t.closest('[data-ac-agent-rename]');
      if(ren){ const id=ren.getAttribute('data-ac-agent-rename'); const a=AC.agents.find(x=>x.id===id); const nm=prompt('重命名智能体', a?a.name:''); if(nm && a){ a.name=nm.trim(); renderApp(); } return; }
      const del = t.closest('[data-ac-agent-delete]');
      if(del){ const id=del.getAttribute('data-ac-agent-delete');
        confirmModal({ title:'删除智能体', content:'确定删除该智能体吗？', onConfirm:()=>{ AC.agents=AC.agents.filter(a=>a.id!==id); delete AgentConfigStore[id]; if(AC.activeAgentId===id){ AC.activeAgentId=AC.agents[0].id; acLoadAgent(AC.activeAgentId); } renderApp(); } });
        return;
      }
      // 技能
      if(t.closest('[data-ac-skill-add]')){ AC.skillDropdownOpen=!AC.skillDropdownOpen; renderApp(); return; }
      if(t.closest('[data-ac-skill-mask]')){ AC.skillDropdownOpen=false; renderApp(); return; }
      const stog = t.closest('[data-ac-skill-toggle]');
      if(stog){ const id=stog.getAttribute('data-ac-skill-toggle');
        const sk=ALL_SKILLS.find(s=>s.id===id);
        if(AC.version==='lite' && !(sk&&sk.lite)){ showToast('当前lite版暂不支持该技能'); return; }
        if(AC.selectedSkillIds.includes(id)) AC.selectedSkillIds=AC.selectedSkillIds.filter(x=>x!==id);
        else AC.selectedSkillIds.push(id);
        renderApp(); return;
      }
      const scust = t.closest('[data-ac-custom-skill]');
      if(scust){ showToast('自定义技能配置'); return; }
      const scrm = t.closest('[data-ac-custom-remove]');
      if(scrm){ const id=scrm.getAttribute('data-ac-custom-remove'); AC.customSkills=AC.customSkills.filter(c=>c.id!==id); renderApp(); return; }
      // MCP
      if(t.closest('[data-ac-mcp-add]')){ showToast('添加MCP服务'); return; }
      const mrm = t.closest('[data-ac-mcp-remove]');
      if(mrm){ const id=mrm.getAttribute('data-ac-mcp-remove'); AC.mcpServices=AC.mcpServices.filter(m=>m.id!==id); renderApp(); return; }
      // AIoT 提示词单选
      const prompt2 = t.closest('[data-ac-prompt]');
      if(prompt2){ AC.promptType=prompt2.getAttribute('data-ac-prompt'); renderApp(); return; }
      // 指令集
      const setDelBtn = t.closest('[data-ac-set-del]');
      if(setDelBtn){ e.stopPropagation(); const id=setDelBtn.getAttribute('data-ac-set-del');
        confirmModal({ title:'删除指令集', content:'确定删除该指令集吗？', onConfirm:()=>{ AC.instructionSets=AC.instructionSets.filter(s=>s.id!==id); delete AC.instructionsBySet[id]; if(AC.activeSetId===id) AC.activeSetId=(AC.instructionSets[0]||{}).id; AC.promptDirty=true; renderApp(); } });
        return;
      }
      if(t.closest('[data-ac-set-create]')){ acCreateSetDrawer(); return; }
      const setBtn = t.closest('[data-ac-set]');
      if(setBtn){ AC.activeSetId=setBtn.getAttribute('data-ac-set'); AC.acSetTab='list'; renderApp(); acInstructionSetDrawer(); return; }
      // 垫句
      if(t.closest('[data-ac-filler-add]')){ if(AC.fillerSentences.length>=5){ showToast('最多5条垫句'); return; } AC.fillerSentences.push(''); renderApp(); return; }
      const fdel = t.closest('[data-ac-filler-del]');
      if(fdel){ const i=parseInt(fdel.getAttribute('data-ac-filler-del')); if(AC.fillerSentences.length<=1){ showToast('至少保留1条'); return; } AC.fillerSentences.splice(i,1); renderApp(); return; }
      // 工具面板：点开前先记录「工具执行」提示词的当前光标位置，再打开合并弹窗
      if(t.closest('[data-ac-tool-panel]')){
        e.stopPropagation();
        const ta0 = document.querySelector('textarea[data-ac-tool-target]');
        AC.toolInsertPos = (ta0 && ta0.selectionStart!=null) ? ta0.selectionStart : (ta0 ? ta0.value.length : 0);
        acToolPanelDrawer();
        return;
      }
      // 三步流程展开
      const step = t.closest('[data-ac-step]');
      if(step){ const k=step.getAttribute('data-ac-step'); AC.expandedSteps[k]=!AC.expandedSteps[k]; renderApp(); return; }
      // 提示词更新 banner
      if(t.closest('[data-ac-prompt-backup]')){
        const txt='【意图准入判断】\n你是一个中文智能家居设备控制意图二分类器。\n\n【任务规划器】\n# Role \n你是东东，京东开发的智能灯语音助手。\n\n【工具执行】\n# Role \n你是东东，京东开发的智能灯语音助手。你的任务是分析用户的自然语言指令，理解其意图，并严格输出对应的JSON。';
        if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>showToast('已复制备份')).catch(()=>showToast('已复制备份')); } else { showToast('已复制备份'); }
        return;
      }
      if(t.closest('[data-ac-prompt-update]')){ AC.promptDirty=false; showToast('提示词已更新'); renderApp(); return; }
      // 编写教程
      if(t.closest('[data-ac-tutorial]')){ acTutorialModal(); return; }
      // 指令区：添加指令下拉框
      if(t.closest('[data-ac-cmd-add]')){
        AC.cmdDropdownOpen=!AC.cmdDropdownOpen;
        renderApp();
        return;
      }
      const cmdGrp=t.closest('[data-ac-cmd-group]');
      if(cmdGrp){
        if(!AC.cmdDropdownExpanded) AC.cmdDropdownExpanded={ sys:true, mine:true };
        const gid=cmdGrp.getAttribute('data-ac-cmd-group');
        AC.cmdDropdownExpanded[gid]=!AC.cmdDropdownExpanded[gid];
        renderApp();
        return;
      }
      const cmdPick=t.closest('[data-ac-cmd-pick]');
      if(cmdPick){
        const name=cmdPick.getAttribute('data-ac-cmd-pick');
        const type=cmdPick.getAttribute('data-ac-cmd-type')||'自定义';
        AC.commands.push({ id:'cmd-'+Date.now(), name, type });
        showToast('已添加指令：'+name);
        renderApp();
        return;
      }
      // 点击下拉框外部关闭（点在下拉框内部不关闭）
      if(AC.cmdDropdownOpen && !t.closest('[data-ac-cmd-dropdown]')){
        AC.cmdDropdownOpen=false;
        renderApp();
        return;
      }
      const cmdDel=t.closest('[data-ac-cmd-del]');
      if(cmdDel){ e.stopPropagation(); const id=cmdDel.getAttribute('data-ac-cmd-del');
        confirmModal({ title:'删除指令', content:'确定删除该指令吗？', onConfirm:()=>{ AC.commands=AC.commands.filter(c=>c.id!==id); renderApp(); } });
        return;
      }
      if(t.closest('[data-ac-cmd]')){ showToast('指令配置'); return; }
      // 交互策略编辑
      const stratEdit = t.closest('[data-ac-strat-edit]');
      if(stratEdit){ acStratDrawer(stratEdit.getAttribute('data-ac-strat-edit')); return; }
      // 调试窗：收起/展开
      if(t.closest('[data-debug-toggle]')){ AC.debugCollapsed=!AC.debugCollapsed; renderApp(); return; }
      // 调试窗：设置面板开关（齿轮）
      if(t.closest('[data-debug-settings]')){ AC.debugSettingsOpen=!AC.debugSettingsOpen; renderApp(); return; }
    };
    // 垫句输入同步（oninput 委托，避免监听器累积）
    app.oninput = function(e){
      const inp = e.target.closest('[data-ac-filler-idx]');
      if(inp){ const i=parseInt(inp.getAttribute('data-ac-filler-idx')); AC.fillerSentences[i]=inp.value; }
    };
    // 调试窗字段同步（onchange 委托，select 与文本输入用 change 避免重渲染丢焦点）
    app.onchange = function(e){
      const fld = e.target.closest('[data-debug-field]');
      if(fld){ const k=fld.getAttribute('data-debug-field'); AC[k]=fld.value; }
    };
  };
  </script>

  <!-- ============ 初始化 ============ -->
  <script>
  /* ---------- 初始化 ---------- */
  document.addEventListener('DOMContentLoaded', function(){
    State.currentPage = State.currentPage || 'index';
    renderApp();
  });
  </script>
</body>
